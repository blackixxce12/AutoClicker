[package]
name = "auto-clicker"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "A configurable auto clicker and key repeater with themes, six languages and a tray icon"
license = "MIT"
build = "build.rs"

[dependencies]
# GUI & Serialization
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Concurrency & Timing
parking_lot = "0.12.5"
spin_sleep = "1.3.3"

# Error Handling & Logging
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
tracing-appender = "0.2.5"

# Embeds assets/icon.ico into the .exe (Explorer / taskbar icon).
# Needs a resource compiler: rc.exe from the Windows SDK (MSVC) or windres.exe (GNU).
# If it is missing the build still succeeds - you just get a warning and no exe icon.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
known-folders = "1.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",                 # CreateMutexW takes SECURITY_ATTRIBUTES
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Media",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"